services:
  claims:
    image: claims
    build:
      context: ../../..
      dockerfile: src/Services/Claims/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables Swagger
      ConnectionStrings__ClaimsDb: Host=postgres;Port=5432;Database=claims;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Database__MigrateOnStartup: "true"
    ports:
      - "5101:8080"
